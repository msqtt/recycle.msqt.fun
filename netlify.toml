[build]
  command = "pnpm install --frozen-lockfile && pnpm build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"
  PNPM_VERSION = "10"

# SPA fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    # unsafe-eval：ajv 运行时编译 JSON Schema 所需
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval'; frame-src https:; connect-src https:; img-src 'self' blob: data:; style-src 'self' 'unsafe-inline'"
    Referrer-Policy = "no-referrer"
    X-Content-Type-Options = "nosniff"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"